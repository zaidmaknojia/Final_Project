[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmedqa-abst"
version = "0.1.0"
description = "Abstention study: does a medical QA model know when it lacks evidence?"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pyyaml>=6",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
